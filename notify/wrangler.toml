name = "pli-notify"
main = "src/index.js"
compatibility_date = "2026-09-01"

# notify.projectleadership.cc — DNS is on Cloudflare, so custom_domain provisions the record
routes = [
  { pattern = "notify.projectleadership.cc", custom_domain = true }
]

# every 5 minutes; sends are gated to :00 / :30 slots and locked to once per day per subscriber
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pli-notify-db"
database_id = "b524cc38-a8be-45b5-80ad-4daa78dd8a93"

[vars]
SITE = "https://projectleadership.cc"
SELF = "https://notify.projectleadership.cc"
# email sender (Resend). MAIL_FROM's domain must be verified in the Resend team that owns RESEND_API_KEY;
# until then the worker falls back to MAIL_FROM_FALLBACK (if set) and finally to Resend's test sender
# (onboarding@resend.dev, deliverable only to the Resend account owner). Target sender later: now@nfn.co.kr.
MAIL_FROM = "PLI 리더십 인사이트 <insight@projectleadership.cc>"
MAIL_REPLY_TO = "now@nfn.co.kr"
# admin dashboard (/admin): login id here, password hash as the ADMIN_PASS_HASH secret (see SETUP.md 7단계)
ADMIN_USER = "admin"
# ADMIN_ALLOW_IPS = "1.2.3.4,5.6.7.8"   # optional: restrict /admin to these IPs

# secrets (wrangler secret put ...):
#   RESEND_API_KEY       resend.com > API Keys (이메일 발송)
#   SIGNING_KEY          32+ random bytes (openssl rand -hex 32) — HMAC for manage tokens
#   ADMIN_PASS_HASH      node scripts/hash-password.js <password> (see SETUP.md)
# the Kakao channel was removed 2026-09-27; its two secrets were deleted from the Worker on 2026-10-01.
#   CRON_SECRET          random string — protects POST /cron/run (manual trigger / tests)
